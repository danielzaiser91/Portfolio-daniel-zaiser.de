name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      # Auslieferung über Cloudflare Pages (löst Plesk als Webhost ab).
      # SPA-Fallback: public/_redirects → /* /index.html 200.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/portfolio/browser --project-name=daniel-zaiser-de --branch=main

      # Übergangsweise noch der Plesk-Weg (Webhook holt den Branch). Kann weg,
      # sobald daniel-zaiser.de nachweislich über Cloudflare läuft.
      - name: Deploy build output to 'deploy' branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/portfolio/browser
          publish_branch: deploy
          force_orphan: true
